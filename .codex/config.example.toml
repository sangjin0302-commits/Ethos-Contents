# korean-law-mcp를 Codex CLI MCP 서버로 등록하는 예시 (docs/legal-verification.md §6)
#
# - 이 파일은 예시다. Codex가 읽도록 하려면 필요한 블록을 ~/.codex/config.toml에 복사한다.
#   (프로젝트 폴더의 .codex/config.toml을 Codex가 직접 읽는지는 확인 필요)
# - 필드 이름은 openai/codex 소스 codex-rs/config/src/mcp_types.rs (2026-10-06 확인)를 따른다.
# - 법제처 Open API 인증키는 셸 환경 변수 LAW_OC로만 둔다. 이 파일이나 저장소에 키를 적지 않는다.
#   Git Bash:  export LAW_OC=발급받은키   (~/.bashrc 등 저장소 밖에 둔다)
# - 아래 두 방식 중 하나만 켠다.

# 방식 A: 원격 서버 (설치 없음). 인증키는 HTTP 헤더 apikey로 보낸다.
# env_http_headers의 값은 키 자체가 아니라 키를 담은 환경 변수 이름이다.
[mcp_servers.korean_law]
url = "https://mcp.gomdori.app/law"
env_http_headers = { "apikey" = "LAW_OC" }

# 방식 B: 로컬 실행 (Node.js 필요). 먼저 설치:
#   npm install --ignore-scripts --omit=optional -g korean-law-mcp
# env_vars는 Codex를 실행한 셸의 LAW_OC를 서버 프로세스로 넘긴다.
# Windows에서 command에 .cmd 확장자가 필요한지는 확인 필요.
#
# [mcp_servers.korean_law]
# command = "korean-law-mcp"
# env_vars = ["LAW_OC"]

# Solar Human Proofreader (선택형). 원격 HTTP MCP이므로 추가 설치 불필요.
# 실제 사용은 개인 ~/.codex/config.toml에 복사해야 하며 이 예시 파일만으로 활성화되지 않는다.
# 공개 가능하고 개인정보가 없는 원고에만 사용한다.
# 무료 한도 내에서는 다음 두 줄만 설정한다.
#
# [mcp_servers.human_proofreader]
# url = "https://human-proofreader-mcp.toy.x.upstage.ai/api/mcp"
#
# 본인 키로 사용할 때에는 아래 env_http_headers를 같은 블록 안에 추가한다.
# 키 값은 config나 GitHub에 저장하지 말고 ETHOS_UPSTAGE_API_KEY 환경 변수로 주입한다.
# env_http_headers = { "X-Upstage-Api-Key" = "ETHOS_UPSTAGE_API_KEY" }
#
# Codex 사용 불가 시 Python CLI 및 수동 GitHub Action 사용:
# docs/human-proofreader-integration.md
