    <div class="z-title" data-zone="title"><h2 class="h2" data-role="headline">기소유예가 곧 자동 감경은 아닙니다</h2></div>
    <div class="z-main" data-zone="main"><div class="krows stack" data-focal><div class="krow"><div class="krow-k"><span class="nobr">경미·부주의</span></div><div class="krow-t">위반 정도가 경미하거나 고의성 없는 사소한 부주의라면 감경을 검토할 수 있습니다.</div></div><div class="krow"><div class="krow-k"><span class="nobr">기소·선고유예</span></div><div class="krow-t">고의성이 없거나 국민보건상 인체 건강을 해칠 우려가 없다는 추가 조건도 살펴야 합니다.</div></div><div class="krow"><div class="krow-k">감경 범위</div><div class="krow-t">법정 요건이 인정되면 정지기간의 2분의 1 이하 범위에서 경감할 수 있습니다.</div></div></div></div>

</div><script>(function(){function fit(){var m=document.querySelector('.z-main');if(!m)return;var tx=[].slice.call(m.querySelectorAll('*')).filter(function(e){if(e.closest('[data-decor]')||e.closest('svg'))return false;for(var i=0;i<e.childNodes.length;i++){var n=e.childNodes[i];if(n.nodeType===3&&n.textContent.trim())return true}return false});var base=tx.map(function(e){return parseFloat(getComputedStyle(e).fontSize)});function over(){if(m.scrollHeight>m.clientHeight+1)return true;var all=m.querySelectorAll('*');for(var i=0;i<all.length;i++){var e=all[i];if(e.clientWidth>0&&e.scrollWidth>e.clientWidth+1&&getComputedStyle(e).display!=='inline')return true}return false}var scale=1;while(over()&&scale>0.92){scale=Math.max(0.92,scale-0.04);tx.forEach(function(e,i){e.style.fontSize=Math.max(16,base[i]*scale)+'px'})}m.setAttribute('data-fit',scale.toFixed(2));m.setAttribute('data-fit-overflow',over()?'1':'0')}if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit)}else{fit()}})();</script></body></html>
