</div><script>(function(){var M=1.6,T=0.9;function fit(){var m=document.querySelector('.z-main');if(!m)return;var k=[].slice.call(m.children).filter(function(e){return !e.hasAttribute('data-decor')});if(!k.length)return;var cs=getComputedStyle(m);var a=m.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);var tx=[].slice.call(m.querySelectorAll('*')).filter(function(e){if(e.closest('[data-decor]'))return false;for(var i=0;i<e.childNodes.length;i++){var n=e.childNodes[i];if(n.nodeType===3&&n.textContent.trim())return true}return false});var base=tx.map(function(e){var c=getComputedStyle(e);return [parseFloat(c.fontSize),parseFloat(c.lineHeight)]});function set(z){tx.forEach(function(e,i){e.style.fontSize=(base[i][0]*z)+'px';if(!isNaN(base[i][1]))e.style.lineHeight=(base[i][1]*z)+'px'})}function used(){var t=k[0].getBoundingClientRect().top,b=k[k.length-1].getBoundingClientRect().bottom;return b-t}function wide(){var b=document.querySelector('.body')||m;var all=[b].concat([].slice.call(b.querySelectorAll('*')));for(var i=0;i<all.length;i++){var e=all[i];if(e.clientWidth>0&&e.scrollWidth>e.clientWidth+1&&getComputedStyle(e).display!=='inline')return true}return m.scrollHeight>m.clientHeight+1}function ok(){return used()<=a*T&&!wide()}if(!ok())return;var lo=1,hi=M;for(var i=0;i<10;i++){var z=(lo+hi)/2;set(z);if(ok())lo=z;else hi=z}lo=Math.floor(lo*100)/100;set(lo);m.setAttribute('data-fit',String(lo))}if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit)}else{fit()}})();</script></body></html>
