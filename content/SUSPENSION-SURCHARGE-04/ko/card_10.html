</div><script>(function(){var M=1.5,T=0.88;function fit(){var m=document.querySelector('.z-main');if(!m)return;var k=[].slice.call(m.children).filter(function(e){return !e.hasAttribute('data-decor')});if(!k.length)return;var cs=getComputedStyle(m);var a=m.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);function set(z){k.forEach(function(e){e.style.zoom=z})}function used(){var t=k[0].getBoundingClientRect().top,b=k[k.length-1].getBoundingClientRect().bottom;return b-t}function wide(){var b=document.querySelector('.body')||m;var all=[b].concat([].slice.call(b.querySelectorAll('*')));for(var i=0;i<all.length;i++){var e=all[i];if(e.clientWidth>0&&e.scrollWidth>e.clientWidth+1&&getComputedStyle(e).display!=='inline')return true}return m.scrollHeight>m.clientHeight+1}function ok(){return used()<=a*T&&!wide()}set(1);if(!ok())return;var lo=1,hi=M;for(var i=0;i<10;i++){var z=(lo+hi)/2;set(z);if(ok())lo=z;else hi=z}set(Math.floor(lo*100)/100);m.setAttribute('data-fit',String(Math.floor(lo*100)/100))}if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit)}else{fit()}})();</script></body></html>
