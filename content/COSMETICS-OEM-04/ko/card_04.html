</div><script>(function(){function fit(){var m=document.querySelector('.z-main');if(!m)return;var tx=[].slice.call(m.querySelectorAll('*')).filter(function(e){if(e.closest('[data-decor]')||e.closest('svg'))return false;for(var i=0;i<e.childNodes.length;i++){var n=e.childNodes[i];if(n.nodeType===3&&n.textContent.trim())return true}return false});var base=tx.map(function(e){return parseFloat(getComputedStyle(e).fontSize)});function over(){if(m.scrollHeight>m.clientHeight+1)return true;var all=m.querySelectorAll('*');for(var i=0;i<all.length;i++){var e=all[i];if(e.clientWidth>0&&e.scrollWidth>e.clientWidth+1&&getComputedStyle(e).display!=='inline')return true}return false}var scale=1;while(over()&&scale>0.72){scale=Math.max(0.72,scale-0.04);tx.forEach(function(e,i){e.style.fontSize=Math.max(16,base[i]*scale)+'px'})}m.setAttribute('data-fit',scale.toFixed(2));m.setAttribute('data-fit-overflow',over()?'1':'0')}if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit)}else{fit()}})();</script></body></html>
