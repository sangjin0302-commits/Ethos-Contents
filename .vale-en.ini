# 영문 카드·웹사이트 영문 MD 윤문 힌트(Vale, MIT). 결과는 모두 권고(info)이며 실패로 치지 않는다.
# 패키지 받기: vale --config=.vale-en.ini sync  (CI에서 자동, 로컬은 한 번만)
# 국문 금지 표현 규칙(styles/ETHOS)은 .vale.ini가 따로 맡는다.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Microsoft, write-good, proselint
Vocab = Ethos

[*.md]
BasedOnStyles = Vale, Microsoft, write-good, proselint
# 법률 영어에서 흔하고 정확한 표현이라 끈다
Microsoft.Contractions = NO
Microsoft.FirstPerson = NO
Microsoft.We = NO
Microsoft.Vocab = NO
Microsoft.Headings = NO
Microsoft.HeadingAcronyms = NO
Microsoft.Acronyms = NO
Microsoft.Dashes = NO
Microsoft.Quotes = NO
Microsoft.Units = NO
Microsoft.Ranges = NO
Microsoft.Auto = NO
Microsoft.Semicolon = NO
Microsoft.QuestionMarks = NO
Microsoft.OxfordComma = NO
Microsoft.Terms = NO
write-good.E-Prime = NO
write-good.So = NO
# 수동태와 한정어(generally, several, may)는 법률 문장의 뜻을 지키므로 지적하지 않는다
Microsoft.Passive = NO
write-good.Passive = NO
write-good.Weasel = NO
Microsoft.Adverbs = NO
