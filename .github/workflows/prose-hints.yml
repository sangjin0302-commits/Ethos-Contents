name: Prose hints

# 블로그·웹사이트·카드·SNS의 국문 발행 문장에 기존 오픈소스 린터를 적용해 PR에 비차단 윤문 힌트를 남긴다.
# 카드 JSON은 실제 보이는 문구만, 배포안은 Korean 절만 임시 추출하므로 메타데이터·영문·추적 링크를 검사하지 않는다.
# MuncheKit(MIT): 번역투·생성형 상투 표현·겹말·모호한 강조. ko-mt-lint(MIT): LLM 출력의 활용·조사 오류.
# 결과는 권고이며 PR을 막지 않는다. 고정 버전 im-not-ai 정량 지표도 추가하지만 자동 윤문·유료 AI 호출은 없다.
# 법률 한정어를 지우라는 규칙은 .munche.json에서 꺼 두었다.

on:
  push:
    paths:
      - "content/**/blog.md"
      - "content/**/website.ko.md"
      - "content/**/card-data.ko.json"
      - "content/**/distribution.md"
      - "content/**/caption.ko.md"
      - "scripts/im_not_ai_review.py"
      - "tests/test_im_not_ai_review.py"
      - ".github/workflows/prose-hints.yml"
  pull_request:
    paths:
      - "content/**/blog.md"
      - "content/**/website.ko.md"
      - "content/**/card-data.ko.json"
      - "content/**/distribution.md"
      - "content/**/caption.ko.md"
      - "scripts/im_not_ai_review.py"
      - "tests/test_im_not_ai_review.py"
      - ".github/workflows/prose-hints.yml"
  workflow_dispatch:
    inputs:
      path:
        description: "확인할 파일 (예: content/<ID>/blog.md)"
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  hints:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install MuncheKit v0.2.0
        continue-on-error: true
        shell: bash
        run: |
          git clone -q --depth 1 --branch v0.2.0 https://github.com/ongsi2/munchekit "$RUNNER_TEMP/munchekit"
          (cd "$RUNNER_TEMP/munchekit" && npm ci --ignore-scripts --silent && npx tsup --silent && chmod +x dist/cli.js)
          mkdir -p "$RUNNER_TEMP/bin" && ln -s "$RUNNER_TEMP/munchekit/dist/cli.js" "$RUNNER_TEMP/bin/munche"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install ko-mt-lint (pinned)
        continue-on-error: true
        shell: bash
        run: python -m pip install "git+https://github.com/eorua8801/ko-mt-lint@9f8ba8464350e37d48bd78d8c9c3a4e8f8fc5cb9"
      - name: Run im-not-ai adapter tests
        shell: bash
        run: python -m unittest discover -s tests -p test_im_not_ai_review.py
      - name: Fetch pinned im-not-ai v2.3.2 for metrics (no AI API)
        shell: bash
        continue-on-error: true
        run: |
          git init -q "$RUNNER_TEMP/im-not-ai"
          git -C "$RUNNER_TEMP/im-not-ai" remote add origin https://github.com/epoko77-ai/im-not-ai.git
          git -C "$RUNNER_TEMP/im-not-ai" fetch -q --depth=1 origin b37e0206d31fffd9149bf57168d4d62eb2086bee
          git -C "$RUNNER_TEMP/im-not-ai" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/im-not-ai" rev-parse HEAD)" = "b37e0206d31fffd9149bf57168d4d62eb2086bee"
      - name: Smoke-test actual pinned im-not-ai metrics
        shell: bash
        run: |
          if [ ! -f "$RUNNER_TEMP/im-not-ai/scripts/prepare_monolith_input.py" ]; then
            echo "::warning::im-not-ai upstream unavailable; runtime smoke test skipped"
            exit 0
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.im_not_ai_review import metrics
          root = Path(os.environ["RUNNER_TEMP"]) / "im-not-ai"
          sample = "제조업 서류를 책임판매업에 옮겨서는 안 됩니다. 책임판매업의 구비서류 목록부터 살펴봅니다."
          data, error = metrics(root, sample)
          if error or not data:
              raise SystemExit(f"pinned upstream metrics failed: {error}")
          if data.get("route_hint") not in ("light", "standard", "heavy"):
              raise SystemExit(f"invalid route_hint: {data.get('route_hint')}")
          print("im-not-ai pinned actual metrics OK; route:", data["route_hint"])
          PY
      - name: Collect hints
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.path }}" ]; then
            files="${{ github.event.inputs.path }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- 'content/**/blog.md' 'content/**/website.ko.md' 'content/**/card-data.ko.json' 'content/**/distribution.md' 'content/**/caption.ko.md' | grep -v '^content/_TEMPLATE/' || true)
          else
            base="${{ github.event.before }}"
            if [[ "$base" =~ ^0+$ ]] || [ -z "$base" ]; then
              files=$(git show --pretty="" --name-only HEAD -- 'content/**/blog.md' 'content/**/website.ko.md' 'content/**/card-data.ko.json' 'content/**/distribution.md' 'content/**/caption.ko.md' | grep -v '^content/_TEMPLATE/' || true)
            else
              files=$(git diff --name-only "$base" HEAD -- 'content/**/blog.md' 'content/**/website.ko.md' 'content/**/card-data.ko.json' 'content/**/distribution.md' 'content/**/caption.ko.md' | grep -v '^content/_TEMPLATE/' || true)
            fi
          fi
          existing=""
          for f in $files; do [ -f "$f" ] && existing="$existing $f"; done
          if [ -n "$existing" ]; then
            python scripts/prose_hints.py $existing > prose-hints.md
            python scripts/im_not_ai_review.py --upstream-root "$RUNNER_TEMP/im-not-ai" $existing >> prose-hints.md
            cat prose-hints.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prose-review
          path: prose-hints.md
          if-no-files-found: ignore
      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s prose-hints.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file prose-hints.md
          fi
