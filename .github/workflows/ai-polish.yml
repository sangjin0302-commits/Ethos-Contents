name: AI polish suggestions

# 국문 카드 카피에 im-not-ai humanize-korean 규칙집으로 윤문 제안을 만든다(Claude API).
# 사실 토큰·길이·변경률 검사를 통과한 제안만 PR 댓글과 작업 요약에 남기고, 파일은 고치지 않는다.
#
# 필요한 설정: 이 저장소 Settings > Secrets and variables > Actions 에 ANTHROPIC_API_KEY 를 등록한다.
# 키가 없으면 이 워크플로는 실패하지 않고 건너뛴다. 실행할 때마다 API 요금이 든다.

on:
  pull_request:
    paths:
      - "content/**/card-data.ko.json"
  workflow_dispatch:
    inputs:
      content_id:
        description: "윤문 제안을 만들 content ID"
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  polish:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check API key
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ANTHROPIC_API_KEY 가 없어 AI 윤문 제안을 건너뜁니다." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: python -m pip install anthropic==1.11.0 jsonschema==4.26.0 kiwipiepy==0.24.0
      - name: Suggest edits
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_ID: ${{ github.event.inputs.content_id }}
        run: |
          if [ -n "$INPUT_ID" ]; then
            IDS="$INPUT_ID"
          else
            IDS=$(git diff --name-only "$BASE"...HEAD -- 'content/*/card-data.ko.json' | cut -d/ -f2 | sort -u | grep -v '^[._]' || true)
          fi
          : > polish.md
          for ID in $IDS; do
            python scripts/ai_polish.py "content/$ID" --report "polish-$ID.md" --suggestions "polish-$ID.json"
            cat "polish-$ID.md" >> polish.md
            echo >> polish.md
          done
      - name: Comment on the pull request
        if: steps.key.outputs.present == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s polish.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file polish.md
          fi
      - name: Upload suggestions
        if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-polish
          path: polish-*.*
          if-no-files-found: ignore
