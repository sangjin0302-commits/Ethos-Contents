name: OEM 04 im-not-ai fidelity verification (temporary)
on:
  push:
    paths:
      - "content/COSMETICS-OEM-04-DRAFT/blog.md"
      - ".github/workflows/oem-04-im-not-ai-verify.yml"
  pull_request:
    paths:
      - "content/COSMETICS-OEM-04-DRAFT/blog.md"
      - ".github/workflows/oem-04-im-not-ai-verify.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Retrieve pinned im-not-ai v2.3.2
        shell: bash
        run: |
          git init -q "$RUNNER_TEMP/im-not-ai"
          git -C "$RUNNER_TEMP/im-not-ai" remote add origin https://github.com/epoko77-ai/im-not-ai.git
          git -C "$RUNNER_TEMP/im-not-ai" fetch -q --depth=1 origin b37e0206d31fffd9149bf57168d4d62eb2086bee
          git -C "$RUNNER_TEMP/im-not-ai" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/im-not-ai" rev-parse HEAD)" = "b37e0206d31fffd9149bf57168d4d62eb2086bee"
      - name: Run upstream route-hint and original-vs-final gates
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/im-not-ai-run"
          cp content/COSMETICS-OEM-04-DRAFT/source-before-humanize.md "$RUNNER_TEMP/im-not-ai-run/01_input.txt"
          python "$RUNNER_TEMP/im-not-ai/scripts/prepare_monolith_input.py" --run-dir "$RUNNER_TEMP/im-not-ai-run" --genre blog --no-sanitize
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          data = json.loads((root / "im-not-ai-run/00_metrics.json").read_text(encoding="utf-8"))
          route = data.get("route_hint")
          if route not in ("light", "standard", "heavy"):
              raise SystemExit("Upstream route_hint missing/invalid: " + str(route))
          before = pathlib.Path("content/COSMETICS-OEM-04-DRAFT/source-before-humanize.md")
          after = pathlib.Path("content/COSMETICS-OEM-04-DRAFT/blog.md")
          cmd = [sys.executable, str(root / "im-not-ai/scripts/verify_gates.py"), "--before", str(before), "--after", str(after), "--genre", "blog", "--json"]
          result = subprocess.run(cmd, capture_output=True, text=True, encoding="utf-8")
          print(result.stdout)
          if result.stderr:
              print(result.stderr, file=sys.stderr)
          report_path = pathlib.Path("oem-04-humanize-gate.txt")
          report_path.write_text(
              "Upstream commit: b37e0206d31fffd9149bf57168d4d62eb2086bee\n"
              f"route_hint: {route}\n"
              f"verify_gates exit_code: {result.returncode}\n"
              f"original_length: {len(before.read_text(encoding='utf-8'))}\n"
              f"final_length: {len(after.read_text(encoding='utf-8'))}\n\n"
              + result.stdout + result.stderr, encoding="utf-8")
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as stream:
              stream.write(f"### im-not-ai v2.3.2\n- route_hint: {route}\n- verify_gates exit code: {result.returncode}\n- source: {before}\n- revision: {after}\n")
          if result.returncode in (2, 3):
              raise SystemExit(result.returncode)
          if result.returncode == 1:
              print("::warning::Upstream gates returned advisory warnings; manual review required.")
          PY
      - name: Upload upstream fidelity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oem-04-im-not-ai-gate
          path: oem-04-humanize-gate.txt
          if-no-files-found: ignore
