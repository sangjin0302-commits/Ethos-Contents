name: Render cards

# 작성자(ChatGPT 또는 사람)가 content/<ID>/card-data.{ko,en}.json 만 올리면 미리보기를 렌더하고 QA한다.
# 이 렌더는 승인이 아니다. 결과 PNG·시트·QA 보고서는 아티팩트로, 요약은 작업 요약(Summary) 탭에 나온다.

on:
  push:
    paths:
      - "content/**/card-data.*.json"
      - "content/**/blog.md"
      - "content/**/terms.json"
      - "content/**/design.css"
      - "content/**/ko/**/*.html"
      - "content/**/en/**/*.html"
      # 기준이 바뀌면 모든 세트를 새 기준으로 다시 렌더해 미리보기와 요약을 갱신한다(바뀐 content가 없으면 전체 세트)
      - "gates.json"
      - "card-limits.json"
      - "copy-rules.json"
      - "schema/**"
      - "scripts/auto_design.py"
      - "scripts/build_cards.py"
      - "scripts/ci_render.py"
      - "scripts/design_review.py"
      - "scripts/qa_render.py"
      - "templates/**"
      - "brand/**"
      - "fonts/**"
      - "assets/icons/**"
      - "assets/illustrations/**"
  pull_request:
    paths:
      - "content/**/card-data.*.json"
      - "content/**/blog.md"
      - "content/**/terms.json"
      - "content/**/design.css"
      - "content/**/ko/**/*.html"
      - "content/**/en/**/*.html"
      # 기준이 바뀌면 모든 세트를 새 기준으로 다시 렌더해 미리보기와 요약을 갱신한다(바뀐 content가 없으면 전체 세트)
      - "gates.json"
      - "card-limits.json"
      - "copy-rules.json"
      - "schema/**"
      - "scripts/auto_design.py"
      - "scripts/build_cards.py"
      - "scripts/ci_render.py"
      - "scripts/design_review.py"
      - "scripts/qa_render.py"
      - "templates/**"
      - "brand/**"
      - "fonts/**"
      - "assets/icons/**"
      - "assets/illustrations/**"
  workflow_dispatch:
    inputs:
      content_id:
        description: "렌더할 content ID (비우면 변경된 세트 또는 전체)"
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  render:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Install Vale (English style hints, advisory)
        continue-on-error: true
        shell: bash
        run: python -m pip install vale==3.22.0.0 && vale --config=.vale-en.ini sync
      - name: Render previews and run gates
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.content_id }}" ]; then
            python scripts/ci_render.py --ids "${{ github.event.inputs.content_id }}"
          else
            python scripts/ci_render.py --changed "${{ github.event.pull_request.base.sha || github.event.before }}"
          fi
      - name: Comment fact and hedge changes on the pull request
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s ci-out/compare.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file ci-out/compare.md
          fi
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-previews
          path: |
            ci-out/**/out/**
          if-no-files-found: ignore
