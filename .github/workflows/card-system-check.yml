name: Card system regression check

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - "schema/**"
      - "gates.json"
      - "assets/**"
      - "card-limits.json"
      - "copy-rules.json"
      - "brand/**"
      - "guidelines/**"
      - "docs/**"
      - "MANIFEST.md"
      - "PROJECT_INSTRUCTIONS.md"
      - "content/_TEMPLATE/**"
      - ".github/workflows/card-system-check.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - "schema/**"
      - "gates.json"
      - "assets/**"
      - "card-limits.json"
      - "copy-rules.json"
      - "brand/**"
      - "guidelines/**"
      - "docs/**"
      - "MANIFEST.md"
      - "PROJECT_INSTRUCTIONS.md"
      - "content/_TEMPLATE/**"
      - ".github/workflows/card-system-check.yml"

jobs:
  smoke:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate active guideline routes
        run: python scripts/validate_guidelines.py
      - name: Install card dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Run reusable card builder checks
        shell: bash
        run: PYTHONUTF8=1 python scripts/card_system_smoke.py
      - name: Run workflow unit tests
        shell: bash
        run: PYTHONUTF8=1 python -m unittest discover -s tests -p "test_*.py"
      - name: Check visual regression
        shell: bash
        run: PYTHONUTF8=1 python scripts/visual_regression.py
      - name: Check the copywriter limits against real renders
        shell: bash
        run: PYTHONUTF8=1 python scripts/spec_stress.py
