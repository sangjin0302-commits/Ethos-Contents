name: Card system regression check

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - "schema/**"
      - "gates.json"
      - ".github/workflows/card-system-check.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - "schema/**"
      - "gates.json"
      - ".github/workflows/card-system-check.yml"

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install jsonschema==4.26.0
      - name: Run reusable card builder checks
        shell: bash
        run: PYTHONUTF8=1 python scripts/card_system_smoke.py
      - name: Run workflow unit tests
        shell: bash
        run: PYTHONUTF8=1 python -m unittest discover -s tests -p "test_*.py"
